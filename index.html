<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar Hisab - Inventory Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Guard against libraries trying to overwrite window.fetch
      (function() {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: false,
          enumerable: true,
          get: function() { return originalFetch; },
          set: function() { console.warn('Something tried to overwrite window.fetch'); }
        });
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50">
    <div id="root"></div>
    <div id="invoice-template"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
